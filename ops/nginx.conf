server {
    listen 80;
    listen [::]:80;
    server_name bnds.life;
    server_tokens off;
    client_max_body_size 16m;

    include /etc/nginx/snippets/bndslife-media.conf;

    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

# Temporary public domain while bnds.life is awaiting ICP filing.
server {
    listen 80;
    listen [::]:80;
    server_name xuesiyuan.com.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://xuesiyuan.com.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xuesiyuan.com.cn;
    server_tokens off;
    client_max_body_size 16m;

    ssl_certificate /etc/letsencrypt/live/xuesiyuan.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xuesiyuan.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BNDS_TLS:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/bndslife-media.conf;

    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
