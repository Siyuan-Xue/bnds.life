# Only playback derivatives and covers are public. Never expose the media root.
location ^~ /media/playback/ {
    auth_request /_bnds_media_access;
    alias /srv/bnds-life/media/playback/;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
    limit_except GET { deny all; }
}
location ^~ /media/posters/ {
    auth_request /_bnds_media_access;
    alias /srv/bnds-life/media/posters/;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
    limit_except GET { deny all; }
}
location = /_bnds_media_access {
    internal;
    proxy_pass http://127.0.0.1:3000/api/internal/media-access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
location ^~ /media/originals/ { return 404; }
location ^~ /media/incoming/ { return 404; }
location ^~ /media/.work/ { return 404; }
